<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Visitas</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Control de visitas: oficina y finca</h1>
        <p>Registra tus visitas y recibe una alerta si no visitas la finca en 2 meses.</p>
      </header>

      <section class="card">
        <h2>Registrar visita</h2>
        <form id="visit-form">
          <label>
            Lugar
            <select id="location" required>
              <option value="oficina">Oficina</option>
              <option value="finca">Finca</option>
            </select>
          </label>

          <label>
            Fecha
            <input id="date" type="date" required />
          </label>

          <button type="submit">Guardar visita</button>
        </form>
      </section>

      <section class="card status" id="finca-status" aria-live="polite"></section>

      <section class="card">
        <h2>Historial</h2>
        <ul id="history-list"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
